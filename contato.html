<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Atividade Flexbox desenvolvimento web">
    <meta name="keywords" content="fatec">
    <meta name="author" content="Tiago Maciel">
    <link rel="shortcut icon" href="img/icon.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <title>Atividade</title>
</head>

<body>
    <header>
        <img src="img/logo.png" alt="Imagem de um celular" id="logo">
        <h1>Phonecell</h1>
    </header>
    <div class="container">
        <div class="conteudo">
            <nav class="menu-lateral">
                <ul>
                    <li><a href="index.html"><i class="bi bi-house"></i> Início</a></li>
                    <li><a href="fotos.html"><i class="bi bi-person-square"></i> Fotos</a></li>
                    <li><a href="contato.html"><i class="bi bi-headset"></i> Contato</a></li>
                    <li><a href="sobre.html"><i class="bi bi-file-text-fill"></i> Sobre</a></li>
                </ul>
            </nav>
            <main>
                <section>
                    <div id="texto">
                        <p>Entre em contato:</p>
                        <div id="form">
                            <form>
                                <div class="form-group">
                                    <label for="exampleFormControlInput1">Endereço de email:</label>
                                    <input type="email" class="form-control" id="exampleFormControlInput1"
                                        placeholder="joao123@gmail.com">
                                </div>
                                <div class="form-group">
                                    <label for="exampleFormControlTextarea1">Comentário:</label>
                                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                                </div>
                                <button type="button" class="btn btn-outline-info">Enviar</button>
                            </form>
                        </div>
                    </div>
                </section>
            </main>

        </div>
        <footer>Footer</footer>
    </div>
</body>

</html>
